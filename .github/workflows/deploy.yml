name: Deploy

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]  # must match build workflow `name:`
    types:
      - completed

jobs:
  deploy:
    # only run if build succeeded AND from main branch
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy endpoint
        run: |
          echo "Triggering deploy..."

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEPLOY_URL }}")

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "204" ]; then
            echo "❌ Deploy failed (unexpected status $STATUS)"
            exit 1
          fi

          echo "✅ Deploy success"