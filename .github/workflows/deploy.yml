name: Deploy

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy endpoint
        run: |
          echo "Triggering deploy..."

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.DEPLOY_URL }}")

          echo "HTTP Status: $STATUS"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "204" ]; then
            echo "❌ Deploy failed (unexpected status $STATUS)"
            exit 1
          fi

          echo "✅ Deploy success"