services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETOS: linux
        TARGETARCH: amd64
    restart: unless-stopped
    volumes:
      - "./config:/app/config"
      - "./app:/app/app"
      - "./routes:/app/routes"
      - "./themes:/app/themes"
      - "./lang:/app/lang"
      - "./extensions:/app/extensions"
      - "./storage/logs:/app/storage/logs"
      - "./storage/public:/app/storage/app/public"
      - "./storage/framework/cache:/app/storage/framework/cache"
      - "./database:/app/database"
      - "./.env:/app/.env"
    ports:
      - "8001:80"
    env_file:
      - .env
    depends_on:
      - database
      - cache

  database:
    image: mariadb:lts
    container_name: paymenter_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootsecret
      MARIADB_DATABASE: paymenter
      MARIADB_USER: paymenter
      MARIADB_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  cache:
    image: redis:alpine
    container_name: paymenter_cache
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  mariadb_data:
